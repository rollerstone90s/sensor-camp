function zoomIcon(){return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M11 8v6M8 11h6"/></svg>`;}

/* ---------- ตัวดูรูปแบบขยาย/ย่อ ---------- */
const LB = {z:1, x:0, y:0, drag:false, px:0, py:0, no:null};
function lbOpen(no){
  LB.no = no; LB.z = 1; LB.x = 0; LB.y = 0;
  const lb = document.getElementById('lb');
  document.getElementById('lbImg').src = IMG[no];
  document.getElementById('lbTitle').textContent =
    'ผังการต่อสาย · ' + byNo[no].no + ' ' + byNo[no].th;
  lb.hidden = false;
  document.body.style.overflow = 'hidden';
  lbApply();
}
function lbClose(){
  document.getElementById('lb').hidden = true;
  document.body.style.overflow = '';
}
function lbApply(){
  LB.z = Math.min(6, Math.max(0.5, LB.z));
  if(LB.z <= 1){ LB.x = 0; LB.y = 0; }
  const img = document.getElementById('lbImg');
  img.style.transform = `translate(${LB.x}px,${LB.y}px) scale(${LB.z})`;
  img.style.cursor = LB.z > 1 ? (LB.drag ? 'grabbing' : 'grab') : 'zoom-in';
  document.getElementById('lbPct').textContent = Math.round(LB.z*100) + '%';
}
function lbZoom(f, cx, cy){
  const old = LB.z; LB.z = Math.min(6, Math.max(0.5, LB.z*f));
  if(cx !== undefined && LB.z > 1){          // ซูมเข้าหาจุดที่ชี้
    const r = LB.z/old;
    LB.x = cx - (cx - LB.x)*r; LB.y = cy - (cy - LB.y)*r;
  }
  lbApply();
}
function initLightbox(){
  const lb = document.getElementById('lb');
  const stage = document.getElementById('lbStage');
  const img = document.getElementById('lbImg');

  lb.addEventListener('click', e=>{
    const z = e.target.closest('[data-zoom]');
    if(z){
      const a = z.dataset.zoom;
      if(a==='in') lbZoom(1.4);
      else if(a==='out') lbZoom(1/1.4);
      else { LB.z=1; LB.x=0; LB.y=0; lbApply(); }
      return;
    }
    if(e.target.closest('#lbClose') || e.target === stage || e.target === lb) lbClose();
  });
  img.addEventListener('click', e=>{ e.stopPropagation(); if(LB.z<=1) lbZoom(2); });
  stage.addEventListener('wheel', e=>{ e.preventDefault();
    const r = stage.getBoundingClientRect();
    lbZoom(e.deltaY<0?1.18:1/1.18, e.clientX-r.left-r.width/2, e.clientY-r.top-r.height/2);
  }, {passive:false});

  img.addEventListener('pointerdown', e=>{
    if(LB.z<=1) return; LB.drag=true; LB.px=e.clientX; LB.py=e.clientY;
    img.setPointerCapture(e.pointerId); lbApply();
  });
  img.addEventListener('pointermove', e=>{
    if(!LB.drag) return;
    LB.x += e.clientX-LB.px; LB.y += e.clientY-LB.py;
    LB.px=e.clientX; LB.py=e.clientY; lbApply();
  });
  ['pointerup','pointercancel'].forEach(ev=>
    img.addEventListener(ev, ()=>{ LB.drag=false; lbApply(); }));

  addEventListener('keydown', e=>{
    if(document.getElementById('lb').hidden) return;
    if(e.key==='Escape') lbClose();
    if(e.key==='+'||e.key==='=') lbZoom(1.4);
    if(e.key==='-') lbZoom(1/1.4);
    if(e.key==='0'){ LB.z=1; LB.x=0; LB.y=0; lbApply(); }
  });
}

/* ---------- เส้นทางหน้า ---------- */
function route(){
  const h = location.hash.replace(/^#\/?/,'');
  const app = document.getElementById('app');
  if(h==='print'){ app.innerHTML = printPage(); initPrint(); }
  else if(/^[1-9]$/.test(h)) app.innerHTML = station(+h);
  else app.innerHTML = home();
  window.scrollTo(0,0);
}
addEventListener('hashchange', route);

document.addEventListener('click', e=>{
  const go = e.target.closest('[data-go]');
  if(go){ location.hash = '#'+go.dataset.go; return; }
  const tb = e.target.closest('[data-tab]');
  if(tb){ switchTab(tb); return; }
  const cp = e.target.closest('[data-code]');
  if(cp){ copyCode(cp); return; }
  const fg = e.target.closest('[data-img]');
  if(fg){ lbOpen(fg.dataset.img); return; }
  if(e.target.closest('#scan,#scan2')) openScan();
  if(e.target.closest('#closeScan')) closeScan();
  if(e.target.closest('#home')) location.hash='';
});

function switchTab(btn){
  const no = btn.parentElement.dataset.tabs;
  const which = btn.dataset.tab;
  const s = byNo[no];
  btn.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t===btn));
  ['base','fun','lcd'].forEach(k=>{
    const el = document.querySelector(`[data-pane="${k}-${no}"]`);
    if(el) el.hidden = (which!==k);
  });
  const info = which==='fun' ? s.fun : (which==='lcd' ? s.lcd : null);
  const parts = document.getElementById('parts-'+no);
  parts.hidden = !info;
  if(info) parts.textContent = 'ต้องใช้เพิ่ม · ' + info.parts;
  document.getElementById('note-'+no).textContent =
    info ? info.desc : 'อ่านค่าเซนเซอร์ให้เห็นผลก่อน';
  btn.closest('.pane').querySelector('[data-code]').dataset.which = which;
}

function copyCode(btn){
  const s = byNo[btn.dataset.code];
  const w = btn.dataset.which;
  const code = (w==='fun' && s.fun) ? s.fun.code
             : (w==='lcd' && s.lcd) ? s.lcd.code : s.code;
  const done = ()=>{ btn.textContent='คัดลอกแล้ว'; btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='คัดลอกโค้ด';btn.classList.remove('ok');},1800); };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(code).then(done).catch(()=>fallback(code,done));
  } else fallback(code,done);
}
function fallback(text,done){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.cssText='position:fixed;top:-9999px';
  document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');done();}catch(_){alert('คัดลอกอัตโนมัติไม่ได้ ให้ลากเลือกโค้ดแล้วกด Ctrl+C');}
  ta.remove();
}

/* ---------- สแกน QR ---------- */
let qr=null;
function openScan(){
  const m=document.getElementById('modal'); m.hidden=false;
  document.getElementById('scanErr').textContent='';
  if(typeof Html5Qrcode==='undefined'){
    document.getElementById('scanErr').textContent=
      'เปิดกล้องไม่ได้เพราะไม่มีอินเทอร์เน็ต ให้เลือกฐานจากหน้าแรกแทน'; return;
  }
  qr = new Html5Qrcode('reader');
  qr.start({facingMode:'environment'},{fps:10,qrbox:210}, txt=>{
    let b=null; const m2 = String(txt).match(/#\/?([1-9])\b/);
    if(m2) b=m2[1]; else if(/^[1-9]$/.test(String(txt).trim())) b=String(txt).trim();
    if(b){ closeScan(); location.hash='#'+b; }
  }, ()=>{}).catch(()=>{
    qr.start({facingMode:'user'},{fps:10,qrbox:210}, txt=>{
      const m2=String(txt).match(/#\/?([1-9])\b/);
      if(m2){ closeScan(); location.hash='#'+m2[1]; }
    }, ()=>{}).catch(err=>{
      document.getElementById('scanErr').textContent=
        'เปิดกล้องไม่ได้ ('+err+') ให้เลือกฐานจากหน้าแรกแทน';
    });
  });
}
function closeScan(){
  const m=document.getElementById('modal');
  if(qr){ qr.stop().then(()=>qr.clear()).catch(()=>{}); qr=null; }
  m.hidden=true;
}

/* ---------- สร้าง QR สำหรับพิมพ์ ---------- */
function initPrint(){
  const mk=()=>{
    const inp=document.getElementById('urlin');
    const grid=document.getElementById('qgrid'); const msg=document.getElementById('qmsg');
    let base=inp.value.trim().replace(/#.*$/,'');
    grid.innerHTML='';
    if(!base){ msg.textContent='ใส่ที่อยู่เว็บก่อน เช่น https://sensorcamp.netlify.app/'; return; }
    if(/^file:/i.test(base)){
      msg.textContent='ที่อยู่นี้เป็นไฟล์ในเครื่อง มือถือสแกนแล้วเปิดไม่ได้ ต้องอัปเว็บขึ้นออนไลน์ก่อน แล้วใช้ที่อยู่ที่ขึ้นต้นด้วย https://';
      return;
    }
    if(!/^https?:\/\//i.test(base)) base='https://'+base;   // เติมให้เองถ้าลืมพิมพ์
    if(!/^https?:\/\/[^\/\s]+\./i.test(base)){
      msg.textContent='ที่อยู่ดูไม่ถูกต้อง ต้องเป็นแบบ https://ชื่อเว็บ.netlify.app/';
      return;
    }
    if(!base.endsWith('/') && !/\.html?$/i.test(base)) base+='/';
    inp.value=base;
    if(typeof qrcode==='undefined'){ msg.textContent='สร้าง QR ไม่ได้ ไลบรารีไม่ทำงาน'; return; }
    msg.textContent='สร้างแล้ว 9 ใบ · ก่อนพิมพ์จริง ลองสแกนสัก 2 ใบด้วยมือถือว่าเปิดถูกฐาน';
    grid.innerHTML = Object.keys(D.bases).sort((a,b)=>a-b).map(b=>{
      const url = base + '#' + b;
      const q = qrcode(0,'M'); q.addData(url); q.make();
      const names = D.bases[b].map(n=>byNo[n].th).join(' · ');
      return `<div class="qr-card"><p class="qr-b">ฐานที่ ${b}</p>
        <p class="qr-s">${esc(names)}</p>${q.createImgTag(5,0)}
        <p class="qr-u">${esc(url)}</p></div>`;
    }).join('');
  };
  document.getElementById('mk').addEventListener('click',mk);
  document.getElementById('urlin').addEventListener('keydown',e=>{if(e.key==='Enter')mk();});
  if(document.getElementById('urlin').value) mk();
}
initLightbox();
route();
</script>
