<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ค่ายเรียนรู้เซนเซอร์ · โค้ด Arduino 18 ชนิด</title>
<meta name="description" content="โค้ด Arduino สำหรับเซนเซอร์ 18 ชนิด แบ่งตามฐานเรียนรู้ 9 ฐาน คัดลอกไปใช้ได้ทันที">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --paper:#EDEFF0; --surface:#FFF; --ink:#0F1519; --ink-2:#4A555E; --ink-3:#7B868E;
  --line:#D5DADD; --code-bg:#151A20; --code-ink:#DCE3EA;
  --med:#B4304F; --agr:#2C7A55; --eng:#1B5FA6; --saf:#C05A17;
  --w-pwr:#D33B32; --w-gnd:#262D33; --w-dig:#1B5FA6; --w-ana:#D98A15; --w-other:#6B7680;
  --r:10px; --maxw:1120px;
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:16px;line-height:1.65}
code,pre,.mono{font-family:"IBM Plex Mono","Sarabun",ui-monospace,monospace}
.display{font-family:"Chakra Petch","IBM Plex Sans Thai",sans-serif;font-weight:600;letter-spacing:.01em}
:focus-visible{outline:3px solid var(--eng);outline-offset:2px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
.g-med{--accent:var(--med)} .g-agr{--accent:var(--agr)}
.g-eng{--accent:var(--eng)} .g-saf{--accent:var(--saf)}

/* ---------- แถบบนสุด ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(237,239,240,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:var(--maxw);margin:0 auto;padding:11px 20px;
  display:flex;align-items:center;gap:14px}
.brand{font-size:14px;font-weight:600;letter-spacing:.02em;color:var(--ink-2);
  background:none;border:0;padding:0;cursor:pointer;font-family:inherit}
.brand:hover{color:var(--ink)}
.top-sp{flex:1}
.btn{font-family:inherit;font-size:14.5px;font-weight:600;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:9px 15px;cursor:pointer;line-height:1.2;transition:.14s}
.btn:hover{border-color:var(--ink-3)}
.btn-scan{background:var(--ink);color:#fff;border-color:var(--ink);display:inline-flex;
  align-items:center;gap:8px}
.btn-scan:hover{background:#1F2830;border-color:#1F2830}

/* ---------- หน้าแรก ---------- */
.hero{padding:52px 0 30px}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 14px}
.hero h1{font-size:clamp(31px,5.4vw,50px);line-height:1.16;margin:0 0 14px;
  font-family:"Chakra Petch","IBM Plex Sans Thai",sans-serif;font-weight:700}
.hero p{font-size:17px;color:var(--ink-2);max-width:56ch;margin:0 0 26px}
.hero-cta{display:flex;flex-wrap:wrap;gap:11px;align-items:center}
.hero-cta .btn{padding:13px 22px;font-size:16px}
.hint{font-size:14px;color:var(--ink-3);margin:14px 0 0}

.h2{font-size:13px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:44px 0 16px;padding-bottom:9px;border-bottom:1px solid var(--line)}

.bases{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:13px}
.base-card{position:relative;display:block;width:100%;text-align:right;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 17px 15px;font-family:inherit;color:inherit;transition:.15s;overflow:hidden}
.base-card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent)}
.base-card:hover{transform:translateY(-2px);border-color:var(--ink-3);
  box-shadow:0 6px 18px rgba(15,21,25,.09)}
.base-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  text-align:left;margin-bottom:9px}
.base-n{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:29px;
  line-height:1;color:var(--accent)}
.base-lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3)}
.base-list{text-align:left;margin:0;padding:0;list-style:none}
.base-list li{font-size:14.5px;color:var(--ink-2);padding:3px 0;
  display:flex;gap:9px;align-items:baseline}
.base-list b{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-3);
  font-weight:500;min-width:20px}

/* ---------- หน้าฐาน ---------- */
.station{padding:34px 0 12px}
.st-num{font-family:"Chakra Petch",sans-serif;font-weight:700;
  font-size:clamp(42px,8vw,66px);line-height:1;color:var(--accent);margin:0}
.st-sub{font-size:15.5px;color:var(--ink-2);margin:5px 0 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  margin:22px 0;overflow:hidden}
.card-top{display:flex;gap:15px;align-items:flex-start;padding:20px 22px;
  border-bottom:1px solid var(--line);border-left:5px solid var(--accent)}
.s-no{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:26px;line-height:1;
  color:var(--accent);flex:none;padding-top:3px}
.s-name{font-size:22px;font-weight:600;line-height:1.3;margin:0}
.s-en{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.11em;
  color:var(--ink-3);margin:4px 0 0;text-transform:uppercase}
.chip{flex:none;font-size:12.5px;font-weight:600;color:#fff;background:var(--accent);
  padding:4px 11px;border-radius:99px;white-space:nowrap}

.body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
.pane{padding:20px 22px;min-width:0}
.pane+.pane{border-left:1px solid var(--line)}
.pane-h{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 13px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;min-height:32px}

/* --- ตารางต่อสายแบบเส้นจัมเปอร์ --- */
.wires{list-style:none;margin:0;padding:0}
.wire{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;
  padding:7px 0}
.wire+.wire{border-top:1px dashed var(--line)}
.wire-l{font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:500}
.wire-n{font-size:12.5px;color:var(--ink-3);margin-top:1px;
  font-family:"IBM Plex Sans Thai",sans-serif}
.wire-r{display:flex;align-items:center;gap:0;flex:none}
.wire-line{width:26px;height:3px;border-radius:2px;background:var(--wc)}
.pin{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;color:#fff;
  background:var(--wc);padding:4px 9px;border-radius:5px;line-height:1.35;white-space:nowrap}
.w-pwr{--wc:var(--w-pwr)} .w-gnd{--wc:var(--w-gnd)} .w-dig{--wc:var(--w-dig)}
.w-ana{--wc:var(--w-ana)} .w-other{--wc:var(--w-other)}

.warn{margin:16px 0 0;padding:11px 13px;background:#FDF6E7;border-left:3px solid #D98A15;
  border-radius:0 7px 7px 0;font-size:14px;color:#5A4413}
.warn b{display:block;font-size:12.5px;letter-spacing:.05em;margin-bottom:2px;color:#8A6410}

/* --- แท็บสลับโค้ด --- */
.tabs{display:flex;gap:6px;margin:0 0 12px;border-bottom:1px solid var(--line)}
.tab{font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;border:0;
  background:none;color:var(--ink-3);padding:8px 12px;border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:.13s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab-note{font-weight:400;text-transform:none;letter-spacing:0;font-size:13px;
  color:var(--ink-2);line-height:1.5;max-width:46ch}
.fun-parts{margin:10px 0 0;font-size:13px;color:var(--ink-2);
  background:#EDF3F9;border-left:3px solid var(--eng);padding:8px 11px;border-radius:0 7px 7px 0}
@media (max-width:560px){.tab{font-size:12.5px;padding:8px 8px}}

/* --- โค้ด --- */
.code-wrap{position:relative;background:var(--code-bg);border-radius:9px;overflow:hidden}
pre{margin:0;padding:15px 16px;overflow-x:auto;font-size:13px;line-height:1.62;
  color:var(--code-ink);tab-size:2}
pre::-webkit-scrollbar{height:9px}
pre::-webkit-scrollbar-thumb{background:#3A444F;border-radius:9px}
.cm{color:#7E8C99}.kw{color:#F09A6B}.ty{color:#6FC3D9}.nu{color:#B7D97C}.st{color:#E9C46A}
.copy{font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:8px;padding:7px 14px;transition:.14s;white-space:nowrap}
.copy:hover{border-color:var(--ink-3)}
.copy.ok{background:#1F7A4D;border-color:#1F7A4D;color:#fff}

.more{border-top:1px solid var(--line)}
.more summary{cursor:pointer;padding:13px 22px;font-size:14.5px;font-weight:600;
  color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:9px}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"+";font-family:"IBM Plex Mono",monospace;font-size:16px;
  color:var(--ink-3);width:15px}
.more[open] summary::before{content:"–"}
.more summary:hover{color:var(--ink)}
.more-in{padding:2px 22px 20px;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.blk h4{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin:0 0 6px}
.blk p{margin:0;font-size:14.5px;color:var(--ink-2)}

.nav{display:flex;gap:11px;justify-content:space-between;padding:12px 0 58px;flex-wrap:wrap}

/* ---------- รูปผังต่อสาย ---------- */
.fig{margin:16px 0 0}
.fig-btn{display:block;width:100%;padding:0;border:1px solid var(--line);background:#fff;
  border-radius:9px;overflow:hidden;cursor:zoom-in;position:relative;transition:.15s}
.fig-btn:hover{border-color:var(--accent)}
.fig-btn img{display:block;width:100%;height:auto}
.fig-tag{position:absolute;right:9px;bottom:9px;display:inline-flex;align-items:center;gap:5px;
  font-family:"IBM Plex Sans Thai",sans-serif;font-size:12.5px;font-weight:600;color:#fff;
  background:rgba(15,21,25,.82);padding:5px 10px;border-radius:99px}
.fig figcaption{font-size:12.5px;color:var(--ink-3);margin-top:7px;text-align:center}

/* ---------- ตัวดูรูปแบบขยาย ---------- */
.lb{position:fixed;inset:0;z-index:95;background:#0E1418;display:flex;flex-direction:column}
.lb[hidden]{display:none}
.lb-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.14);flex:none}
.lb-title{flex:1;min-width:150px;color:#fff;font-size:14.5px;font-weight:600}
.lb-tools{display:flex;align-items:center;gap:7px}
.lb-b{font-family:inherit;font-size:18px;font-weight:600;line-height:1;width:38px;height:38px;
  border-radius:9px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);
  color:#fff;cursor:pointer;transition:.13s}
.lb-b:hover{background:rgba(255,255,255,.2)}
.lb-w{width:auto;padding:0 14px;font-size:14px}
.lb-pct{color:#fff;font-family:"IBM Plex Mono",monospace;font-size:13px;min-width:48px;
  text-align:center}
.lb-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;
  padding:14px;touch-action:none}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;
  user-select:none;-webkit-user-drag:none;background:#fff;border-radius:6px}
.lb-hint{text-align:center;color:rgba(255,255,255,.55);font-size:12.5px;margin:0;padding:0 16px 13px}
@media (max-width:560px){
  .lb-title{display:none}
  .lb-hint{display:none}
  .lb-bar{padding:10px 12px}
  .lb-tools{width:100%;justify-content:space-between}
  .lb-stage{padding:8px}
}

/* ---------- กล้องสแกน ---------- */
.modal{position:fixed;inset:0;z-index:90;background:rgba(15,21,25,.9);
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.sheet{background:var(--surface);border-radius:15px;width:100%;max-width:430px;
  padding:22px;text-align:center}
.sheet h3{margin:0 0 5px;font-size:19px;font-weight:600}
.sheet p{margin:0 0 15px;font-size:14.5px;color:var(--ink-2)}
#reader{border-radius:11px;overflow:hidden;background:#000;min-height:230px}
#reader video{width:100%!important;display:block}
.err{font-size:14px;color:var(--med);margin:13px 0 0}

/* ---------- หน้าพิมพ์ QR ---------- */
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:15px;
  margin:20px 0 50px}
.qr-card{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:17px;
  text-align:center;break-inside:avoid}
.qr-card canvas,.qr-card img{width:100%;max-width:172px;height:auto;image-rendering:pixelated}
.qr-b{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:27px;margin:0 0 3px}
.qr-s{font-size:13.5px;color:var(--ink-2);margin:0 0 11px;min-height:2.7em}
.qr-u{font-family:"IBM Plex Mono",monospace;font-size:12.5px;margin:10px 0 0;
  word-break:break-all;color:var(--ink-2)}
.field{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}
.field input{flex:1;min-width:230px;font-family:"IBM Plex Mono",monospace;font-size:15px;
  padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}

@media (max-width:860px){
  .body{grid-template-columns:minmax(0,1fr)}
  .pane+.pane{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:560px){
  .wrap{padding:0 15px}.pane{padding:17px}.card-top{padding:17px}
  .hero{padding:34px 0 22px}
  .chip{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .top,.nav,.no-print{display:none!important}
  body{background:#fff}
  .qr-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="brand" id="home">ค่ายเรียนรู้เซนเซอร์</button>
    <span class="top-sp"></span>
    <button class="btn btn-scan" id="scan">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M7 12h10"/></svg>
      สแกน QR</button>
  </div>
</header>

<main id="app"></main>

<div class="lb" id="lb" hidden>
  <div class="lb-bar">
    <span class="lb-title" id="lbTitle"></span>
    <span class="lb-tools">
      <button class="lb-b" data-zoom="out" aria-label="ย่อ">&minus;</button>
      <span class="lb-pct" id="lbPct">100%</span>
      <button class="lb-b" data-zoom="in" aria-label="ขยาย">+</button>
      <button class="lb-b lb-w" data-zoom="fit">พอดีจอ</button>
      <button class="lb-b lb-w" id="lbClose">ปิด</button>
    </span>
  </div>
  <div class="lb-stage" id="lbStage"><img id="lbImg" alt="ผังการต่อสาย" draggable="false"></div>
  <p class="lb-hint">เลื่อนล้อเมาส์เพื่อซูม · ลากเพื่อเลื่อนดู · กด Esc เพื่อปิด</p>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <h3>สแกน QR ที่ฐาน</h3>
    <p>ยกป้าย QR ขึ้นให้กล้องเห็น ระบบจะพาไปหน้าฐานเอง</p>
    <div id="reader"></div>
    <p class="err" id="scanErr"></p>
    <button class="btn" id="closeScan" style="margin-top:14px;width:100%">ปิด</button>
  </div>
